name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: access
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d access"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/access

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Load schema and seed data
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d access -f db/schema.sql
          PGPASSWORD=postgres psql -h localhost -U postgres -d access -f db/seed.sql
      - run: npm run typecheck
      - run: npm test
